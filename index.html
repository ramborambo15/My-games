<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Launcher</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #152238, #0f141f 60%, #26343a);
      color: #eef7ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 620px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    a {
      min-height: 156px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      color: inherit;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(238, 247, 255, 0.16);
      border-radius: 8px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    }

    a:hover,
    a:focus-visible {
      outline: 2px solid #ffb238;
      outline-offset: 3px;
      background: rgba(255, 255, 255, 0.13);
    }

    strong {
      display: block;
      font-size: 24px;
      line-height: 1.05;
    }

    span {
      display: block;
      color: #a9bbcc;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 650;
    }

    em {
      width: fit-content;
      min-height: 38px;
      display: inline-grid;
      place-items: center;
      padding: 0 12px;
      border-radius: 8px;
      color: #101723;
      background: #ffb238;
      font-style: normal;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pick a game</h1>
    <div class="grid">
      <a href="stick-shooter.html">
        <div>
          <strong>Stickline Rush</strong>
          <span>Move, aim, and survive waves of stick-figure enemies.</span>
        </div>
        <em>Play</em>
      </a>
      <a href="wing-hop.html">
        <div>
          <strong>Wing Hop</strong>
          <span>Tap through the gates and chase your best score.</span>
        </div>
        <em>Play</em>
      </a>
    </div>
  </main>
</body>
</html>
