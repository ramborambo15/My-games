<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxel Realm</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <header class="hud" aria-hidden="true">
    <div class="metric"><span>Block</span><strong id="blockName">Grass</strong></div>
    <div class="metric"><span>Mode</span><strong id="mode">Build</strong></div>
    <div class="metric"><span>Pos</span><strong id="pos">0 0</strong></div>
  </header>

  <section class="panel" id="menu">
    <p class="eyebrow">Original voxel sandbox</p>
    <h1>Voxel Realm</h1>
    <p class="copy">A reliable block-building sandbox. Move around, mine blocks, place blocks, and build on a generated world.</p>
    <div class="actions">
      <button id="startBtn" type="button">Play</button>
      <button class="ghost" id="resetBtn" type="button">Reset World</button>
    </div>
    <div class="keys">
      <span>WASD Move</span>
      <span>Mouse Aim</span>
      <span>Left Mine</span>
      <span>Right Place</span>
      <span>1-6 Blocks</span>
      <span>Wheel Zoom</span>
    </div>
  </section>

  <footer class="hotbar" aria-label="Block hotbar">
    <button class="slot active" data-slot="0" type="button"><i style="--c:#56b85a"></i><span>1</span></button>
    <button class="slot" data-slot="1" type="button"><i style="--c:#8a603f"></i><span>2</span></button>
    <button class="slot" data-slot="2" type="button"><i style="--c:#8d8f98"></i><span>3</span></button>
    <button class="slot" data-slot="3" type="button"><i style="--c:#c9a66b"></i><span>4</span></button>
    <button class="slot" data-slot="4" type="button"><i style="--c:#5ca3ff"></i><span>5</span></button>
    <button class="slot" data-slot="5" type="button"><i style="--c:#5b3a24"></i><span>6</span></button>
  </footer>

  <script src="./src/main.js"></script>
</body>
</html>
